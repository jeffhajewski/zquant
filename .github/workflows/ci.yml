name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ZIG_VERSION: "0.16.0"

jobs:
  # ============================================
  # Zig library and tests
  # ============================================
  zig-build:
    name: Zig Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Check formatting
        run: zig fmt --check build.zig src bench tests

      # Covers the Zig unit and integration suites and, through the same step, the C ABI
      # smoke test — compiled as C and linked against the static library, so the header
      # and exported symbols are exercised the way a binding author meets them.
      - name: Run tests
        run: zig build test

      - name: Build C ABI library
        run: zig build lib

      - name: Upload library
        uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.os }}
          path: |
            zig-out/lib/
            zig-out/include/

  # ============================================
  # Python client
  # ============================================
  python-test:
    name: Python Client
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python-version: ['3.9', '3.11', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      # Built in-job rather than downloaded from zig-build. actions/upload-artifact does
      # not preserve file permissions, and the library arrived without its executable
      # bit; the job is self-contained now and the library takes seconds to build.
      - name: Build library
        run: zig build lib

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install client
        working-directory: clients/python
        run: pip install -e ".[test]"

      # Separated from the test run so a failure to load the library is distinguishable
      # from a test that ran and failed.
      - name: Check the library loads
        working-directory: clients/python
        run: python -c "import zquant; print('zquant', zquant.version())"

      - name: Run tests
        working-directory: clients/python
        run: pytest -q

  # ============================================
  # TypeScript client
  # ============================================
  typescript-test:
    name: TypeScript Client
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        node-version: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build library
        run: zig build lib

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        working-directory: clients/typescript
        run: npm install

      - name: Check types
        working-directory: clients/typescript
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: clients/typescript
        run: npm test

  # ============================================
  # Go client
  # ============================================
  go-test:
    name: Go Client
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build library
        run: zig build lib

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: clients/go/go.mod

      - name: Vet
        working-directory: clients/go
        run: go vet -tags repolocal ./...

      - name: Run tests (repository-local)
        working-directory: clients/go
        run: go test -tags repolocal ./...

  # Both linking paths are supported, so both are exercised: the repo-local build above
  # and the pkg-config one a downstream consumer would actually use.
  go-installed:
    name: Go Installed Workflow
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: clients/go/go.mod

      - name: Install to a prefix
        run: zig build install --prefix /tmp/zquant-install

      - name: Run tests via pkg-config
        working-directory: clients/go
        env:
          PKG_CONFIG_PATH: /tmp/zquant-install/lib/pkgconfig
          LD_LIBRARY_PATH: /tmp/zquant-install/lib
        run: go test ./...

  # ============================================
  # End-to-end benchmark
  # ============================================
  #
  # The quickbench is a correctness check that happens to report throughput: it builds
  # its own corpora, computes exact ground truth, and would fail loudly if recall
  # collapsed. Running it on CI hardware also keeps the README's claim that cloning and
  # running one command works on a machine that is not the author's.
  quickbench:
    name: End-to-end benchmark
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Run quickbench
        run: zig build quickbench -Doptimize=ReleaseFast

  # ============================================
  # Cross-compilation
  # ============================================
  #
  # Zig cross-compiles without a toolchain per target, so the release artifacts can be
  # checked on every push rather than discovered to be broken at tag time.
  cross-compile:
    name: Cross-compile ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-macos
          - aarch64-macos
          - x86_64-windows-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build library
        run: zig build lib -Dtarget=${{ matrix.target }}
