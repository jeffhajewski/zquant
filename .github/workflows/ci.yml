name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ZIG_VERSION: "0.16.0"

jobs:
  # ============================================
  # Zig library and tests
  # ============================================
  zig-build:
    name: Zig Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Check formatting
        run: zig fmt --check build.zig src bench tests

      # Covers the Zig unit and integration suites and, through the same step, the C ABI
      # smoke test — compiled as C and linked against the static library, so the header
      # and exported symbols are exercised the way a binding author meets them.
      - name: Run tests
        run: zig build test

      - name: Build C ABI library
        run: zig build lib

      - name: Upload library
        uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.os }}
          path: |
            zig-out/lib/
            zig-out/include/

  # ============================================
  # The release CPU configurations, run natively
  # ============================================
  #
  # Releases are built for specific CPU levels (release.yml explains why), and the
  # baseline rows are the only place the scalar fallback kernels run at all: every
  # other job builds for the runner's own CPU, which has the fast instructions. arm64
  # Linux and Windows are covered here and nowhere else. Same matrix as the gate in
  # release.yml, so a platform break shows up on the commit that caused it rather than
  # at tag time.
  platform-test:
    name: Platform ${{ matrix.os }} (${{ matrix.cpu }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    cpu: x86_64_v2 }
          - { os: ubuntu-latest,    cpu: baseline }
          - { os: ubuntu-24.04-arm, cpu: generic+dotprod }
          - { os: ubuntu-24.04-arm, cpu: baseline }
          - { os: macos-15,         cpu: baseline }
          - { os: windows-latest,   cpu: x86_64_v2 }
          - { os: windows-latest,   cpu: baseline }

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Run tests
        run: zig build test -Dcpu=${{ matrix.cpu }} -Doptimize=ReleaseSafe

  # ============================================
  # Python client
  # ============================================
  python-test:
    name: Python Client
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        python-version: ['3.11', '3.13']
        # 3.9 is the oldest version pyproject.toml accepts. setup-python has no build of it
        # for Ubuntu 26.04, which ubuntu-latest became in October 2026, so it runs on 24.04.
        include:
          - { os: ubuntu-24.04, python-version: '3.9' }

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      # Built in-job rather than downloaded from zig-build. actions/upload-artifact does
      # not preserve file permissions, and the library arrived without its executable
      # bit; the job is self-contained now and the library takes seconds to build.
      #
      # ReleaseSafe, not the shipped ReleaseFast: the bindings are what hand the library
      # pointers and lengths, and with safety checks on, a binding that passes a short
      # buffer or a wrong count panics with a message instead of corrupting memory and
      # passing anyway.
      - name: Build library
        run: zig build lib -Dlib-opt=ReleaseSafe

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install client
        working-directory: clients/python
        run: pip install -e ".[test]"

      # Separated from the test run so a failure to load the library is distinguishable
      # from a test that ran and failed.
      - name: Check the library loads
        working-directory: clients/python
        run: python -c "import zquant; print('zquant', zquant.version())"

      # Split so a failure names itself. Job logs need admin rights on this repository,
      # so the step name is the only diagnostic that survives to the API - and a CI-only
      # failure with no readable log is otherwise a guessing game.
      - name: Run tests
        working-directory: clients/python
        run: pytest -q

  # The installed package, not the checkout: build a wheel with the library inside, install
  # it into a fresh venv in a directory with no repository nearby, and check that the
  # library it loads is the one inside the wheel. Nothing tested this before, and the
  # binding could only find a library built in the repository.
  python-package:
    name: Python wheel (installed outside the repo)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the wheel
        run: WHEEL_DIR="$RUNNER_TEMP/wheels" bash clients/python/scripts/build_wheel.sh

      - name: Install and use it outside the repository
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv venv
          venv/bin/pip install wheels/zquant-*.whl
          venv/bin/python - <<'PY'
          import numpy as np, zquant
          info = zquant.build_info()
          print(info)
          assert "site-packages" in str(info.library), info.library
          assert not info.portable
          x = np.random.default_rng(0).standard_normal((2000, 64)).astype("float32")
          index = zquant.Index(dim=64, bits=5)
          index.add(x, threads=2)
          ids, _ = index.search(x[:20], k=1)
          assert (ids[:, 0] == np.arange(20)).all(), ids[:, 0]
          again = zquant.Index.from_bytes(index.to_bytes())
          assert (again.search(x[:20], k=1)[0] == ids).all()
          print("ok")
          PY

  # ============================================
  # TypeScript client
  # ============================================
  typescript-test:
    name: TypeScript Client
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        node-version: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build library (with safety checks; see the Python job)
        run: zig build lib -Dlib-opt=ReleaseSafe

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        working-directory: clients/typescript
        run: npm install

      - name: Check types
        working-directory: clients/typescript
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: clients/typescript
        run: npm test

  # The packed tarball, installed outside the repository. package.json's entry point once
  # pointed at a file the build never produced, and only installing the package shows it.
  typescript-package:
    name: TypeScript package (installed outside the repo)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build the library and a portable one to bundle with it
        run: |
          zig build lib
          zig build lib -Dcpu=baseline -Dlib-name=zquant-portable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pack
        working-directory: clients/typescript
        run: |
          npm install
          npm run pack:native
          mv zquant-*.tgz "$RUNNER_TEMP/"

      - name: Install and use it outside the repository
        working-directory: ${{ runner.temp }}
        run: |
          mkdir consumer && cd consumer
          npm init -y > /dev/null
          npm install ../zquant-*.tgz
          ls node_modules/zquant/prebuilds/*/
          cat > use.mjs <<'JS'
          import { Index, buildInfo } from 'zquant';
          const info = buildInfo();
          console.log(info);
          if (!info.libraryPath.includes('node_modules')) throw new Error(`loaded ${info.libraryPath}`);
          const dim = 64, n = 2000;
          const x = new Float32Array(n * dim).map(() => Math.random() - 0.5);
          const index = new Index({ dim, bits: 5 });
          index.add(x, { threads: 2 });
          const { ids } = index.search(x.subarray(0, 20 * dim), { k: 1 });
          for (let i = 0; i < 20; i++) if (ids[i] !== i) throw new Error(`query ${i} found ${ids[i]}`);
          const again = Index.deserialize(index.serialize());
          if (again.search(x.subarray(0, dim), { k: 1 }).ids[0] !== 0) throw new Error('round trip');
          index.close(); again.close();
          console.log('ok');
          JS
          env -u ZQUANT_LIB node use.mjs

  # ============================================
  # Go client
  # ============================================
  go-test:
    name: Go Client
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build library (with safety checks; see the Python job)
        run: zig build lib -Dlib-opt=ReleaseSafe

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: clients/go/go.mod

      - name: Vet
        working-directory: clients/go
        run: go vet -tags repolocal ./...

      # -race matters here more than in most Go code: handles are freed by Close and by
      # finalizers, and the binding's locking is what keeps a search from using one
      # after it is gone.
      - name: Run tests (repository-local, race detector)
        working-directory: clients/go
        run: go test -race -tags repolocal ./...

  # Both linking paths are supported, so both are exercised: the repo-local build above
  # and the pkg-config one a downstream consumer would actually use.
  go-installed:
    name: Go Installed Workflow
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: clients/go/go.mod

      # Installed by `zig build lib` (what the release tarballs contain), then moved: the
      # pkg-config file is relative to where it sits and carries an rpath, so it must
      # work from a directory other than the one it was built for, with no
      # LD_LIBRARY_PATH. It used to bake in the absolute build prefix.
      - name: Install to a prefix, then move it
        run: |
          zig build lib --prefix /tmp/zquant-build
          mv /tmp/zquant-build /tmp/zquant-moved

      - name: Run tests via pkg-config
        working-directory: clients/go
        env:
          PKG_CONFIG_PATH: /tmp/zquant-moved/lib/pkgconfig
        run: go test -race ./...

  # ============================================
  # End-to-end benchmark
  # ============================================
  #
  # The quickbench is a correctness check that happens to report throughput: it builds
  # its own corpora, computes exact ground truth, and would fail loudly if recall
  # collapsed. Running it on CI hardware also keeps the README's claim that cloning and
  # running one command works on a machine that is not the author's.
  quickbench:
    name: End-to-end benchmark
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      # Also written to the job summary, which anyone can read; job logs need admin
      # rights on this repository. This is the only x86_64 throughput the project
      # measures, so it should be visible.
      - name: Run quickbench
        run: |
          set -o pipefail
          zig build quickbench 2>&1 | tee quickbench.txt
          {
            echo '### quickbench on ubuntu-latest (x86_64)'
            echo '```'
            cat quickbench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================
  # Cross-compilation
  # ============================================
  #
  # Zig cross-compiles without a toolchain per target, so the release artifacts can be
  # checked on every push rather than discovered to be broken at tag time.
  cross-compile:
    name: Cross-compile ${{ matrix.target }} (${{ matrix.cpu }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The release matrix, target and CPU alike (release.yml explains the CPUs).
        include:
          - { target: x86_64-linux-gnu.2.17,  cpu: x86_64_v2 }
          - { target: x86_64-linux-gnu.2.17,  cpu: baseline }
          - { target: aarch64-linux-gnu.2.17, cpu: generic+dotprod }
          - { target: aarch64-linux-gnu.2.17, cpu: baseline }
          - { target: x86_64-macos,       cpu: baseline }
          - { target: aarch64-macos,      cpu: baseline }
          - { target: x86_64-windows-gnu, cpu: x86_64_v2 }
          - { target: x86_64-windows-gnu, cpu: baseline }

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build library
        run: zig build lib -Dtarget=${{ matrix.target }} -Dcpu=${{ matrix.cpu }}

      # The point of the CPU choice: the shipped kernels must actually be the native
      # ones. The aarch64 and x86_64 Linux builds used to fall back to scalar code. The
      # library embeds which it compiled to (zq_build_kernels), so a grep of the binary
      # checks it without a disassembler for the target architecture.
      - name: Check the kernels are native, not the scalar fallback
        if: matrix.cpu != 'baseline'
        run: |
          set -e
          lib=$(find zig-out -name 'libzquant.so' -o -name 'libzquant.dylib' -o -name 'zquant.dll' | head -1)
          grep -a -o 'zquant-kernels [a-z=]* [a-z=]*' "$lib"
          grep -a -q 'zquant-kernels shuffle=native dot=native' "$lib"

      # Linux libraries target glibc 2.17 (RHEL 7, and the manylinux_2_17 wheels'
      # promise). The default Zig picks is newer: the arm64 library imported exp and log
      # at GLIBC_2.29 and would not load on RHEL 8, Debian 10 or Amazon Linux 2. The
      # version strings are in .dynstr, so a grep reads them for any architecture.
      - name: Check the glibc floor
        if: contains(matrix.target, 'linux')
        run: |
          lib=$(find zig-out -name 'libzquant*.so' | head -1)
          newest=$(grep -a -o 'GLIBC_[0-9][0-9.]*' "$lib" | sed 's/^GLIBC_//' | sort -uV | tail -1)
          echo "$lib: newest glibc symbol version $newest"
          [ "$(printf '%s\n' "$newest" 2.17 | sort -V | tail -1)" = 2.17 ]
