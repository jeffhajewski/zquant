name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  ZIG_VERSION: "0.16.0"

jobs:
  # Zig cross-compiles every target from one runner, so the release matrix does not need
  # a machine per platform and every artifact is produced by the same compiler build.
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each target is built for a CPU with the instructions the scan kernels need:
        # SSSE3 on x86_64 (x86_64_v2, the RHEL 9 baseline) and the dot-product extension
        # on arm64. Built for the bare architecture baseline instead, search is 6-10x
        # slower, which is what these artifacts used to ship. The macOS baselines already
        # include both (core2 has SSSE3; every Apple arm64 CPU has dotprod).
        #
        # Each also has a `-portable` build for the baseline, for CPUs without them. The
        # library checks at load time (zq_cpu_supported) rather than dying of an illegal
        # instruction, and the Python and TypeScript clients fall back to the portable
        # build automatically when it is installed alongside.
        include:
          - { target: x86_64-linux-gnu,    cpu: x86_64_v2,       name: linux-x86_64 }
          - { target: x86_64-linux-gnu,    cpu: baseline,        name: linux-x86_64-portable }
          - { target: aarch64-linux-gnu,   cpu: generic+dotprod, name: linux-aarch64 }
          - { target: aarch64-linux-gnu,   cpu: baseline,        name: linux-aarch64-portable }
          - { target: x86_64-macos,        cpu: baseline,        name: macos-x86_64 }
          - { target: aarch64-macos,       cpu: baseline,        name: macos-aarch64 }
          - { target: x86_64-windows-gnu,  cpu: x86_64_v2,       name: windows-x86_64 }
          - { target: x86_64-windows-gnu,  cpu: baseline,        name: windows-x86_64-portable }

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: zig build lib -Dtarget=${{ matrix.target }} -Dcpu=${{ matrix.cpu }}

      - name: Package
        run: |
          staging="zquant-${{ matrix.name }}"
          mkdir -p "$staging"
          cp -r zig-out/lib "$staging/"
          cp -r zig-out/include "$staging/"
          cp README.md LICENSE "$staging/" 2>/dev/null || cp README.md "$staging/"
          tar czf "$staging.tar.gz" "$staging"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zquant-${{ matrix.name }}
          path: zquant-${{ matrix.name }}.tar.gz

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
