name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  ZIG_VERSION: "0.16.0"

jobs:
  # Zig cross-compiles every target from one runner, so the release matrix does not need
  # a machine per platform and every artifact is produced by the same compiler build.
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each target is built for a CPU with the instructions the scan kernels need:
        # SSSE3 on x86_64 (x86_64_v2, the RHEL 9 baseline) and the dot-product extension
        # on arm64. Built for the bare architecture baseline instead, search is 6-10x
        # slower, which is what these artifacts used to ship. The macOS baselines already
        # include both (core2 has SSSE3; every Apple arm64 CPU has dotprod).
        #
        # Each also has a `-portable` build for the baseline, for CPUs without them,
        # named libzquant-portable so it can be unpacked into the same directory. The
        # library checks at load time (zq_cpu_supported) rather than dying of an illegal
        # instruction, and the Python and TypeScript clients fall back to
        # libzquant-portable automatically when it sits alongside.
        include:
          - { target: x86_64-linux-gnu.2.17,  cpu: x86_64_v2,       lib: zquant,          name: linux-x86_64 }
          - { target: x86_64-linux-gnu.2.17,  cpu: baseline,        lib: zquant-portable, name: linux-x86_64-portable }
          - { target: aarch64-linux-gnu.2.17, cpu: generic+dotprod, lib: zquant,          name: linux-aarch64 }
          - { target: aarch64-linux-gnu.2.17, cpu: baseline,        lib: zquant-portable, name: linux-aarch64-portable }
          - { target: x86_64-macos,        cpu: baseline,        lib: zquant,          name: macos-x86_64 }
          - { target: aarch64-macos,       cpu: baseline,        lib: zquant,          name: macos-aarch64 }
          - { target: x86_64-windows-gnu,  cpu: x86_64_v2,       lib: zquant,          name: windows-x86_64 }
          - { target: x86_64-windows-gnu,  cpu: baseline,        lib: zquant-portable, name: windows-x86_64-portable }

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: zig build lib -Dtarget=${{ matrix.target }} -Dcpu=${{ matrix.cpu }} -Dlib-name=${{ matrix.lib }} -Dstrip

      # The fast builds must contain the fast kernels: that is the reason for the CPU
      # choice, and a silent fall back to scalar code is what the releases used to ship.
      - name: Check the kernels
        if: matrix.cpu != 'baseline'
        run: |
          lib=$(find zig-out -name '*.so' -o -name '*.dylib' -o -name '*.dll' | head -1)
          grep -a -o 'zquant-kernels [a-z=]* [a-z=]*' "$lib"
          grep -a -q 'zquant-kernels shuffle=native dot=native' "$lib"

      # x86_64 builds below AVX2 also carry the AVX2 kernels, chosen at run time
      # (src/simd/dispatch.zig). Their description is in the binary as well.
      - name: Check the AVX2 kernels are linked in
        if: startsWith(matrix.target, 'x86_64') && matrix.lib == 'zquant'
        run: grep -a -q 'zquant-kernels shuffle=native dot=native wide=avx2' "$(find zig-out -name '*.so' -o -name '*.dylib' -o -name '*.dll' | head -1)"

      # Linux libraries target glibc 2.17 (RHEL 7, and the manylinux_2_17 wheels'
      # promise). The default Zig picks is newer: the arm64 library imported exp and log
      # at GLIBC_2.29 and would not load on RHEL 8, Debian 10 or Amazon Linux 2. The
      # version strings are in .dynstr, so a grep reads them for any architecture.
      - name: Check the glibc floor
        if: contains(matrix.target, 'linux')
        run: |
          lib=$(find zig-out -name 'libzquant*.so' | head -1)
          newest=$(grep -a -o 'GLIBC_[0-9][0-9.]*' "$lib" | sed 's/^GLIBC_//' | sort -uV | tail -1)
          echo "$lib: newest glibc symbol version $newest"
          [ "$(printf '%s\n' "$newest" 2.17 | sort -V | tail -1)" = 2.17 ]

      # bin/ holds the Windows DLL; lib/ holds its import library, the static library
      # and the pkg-config file.
      - name: Package
        run: |
          staging="zquant-${{ matrix.name }}"
          mkdir -p "$staging"
          cp -r zig-out/lib zig-out/include "$staging/"
          if [ -d zig-out/bin ]; then cp -r zig-out/bin "$staging/"; fi
          cp README.md LICENSE "$staging/" 2>/dev/null || cp README.md "$staging/"
          tar czf "$staging.tar.gz" "$staging"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zquant-${{ matrix.name }}
          path: zquant-${{ matrix.name }}.tar.gz

  # The cross-compiled artifacts above are never executed on the runner that built
  # them, so nothing is published until the same CPU configurations have run the full
  # suite - Zig tests and the C ABI smoke test - on hardware of each architecture.
  # (macOS x86_64 has no native runner here; its build is the same code as Linux
  # x86_64 at a lower CPU level.)
  test:
    name: Test ${{ matrix.os }} (${{ matrix.cpu }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    cpu: x86_64_v2 }
          - { os: ubuntu-latest,    cpu: baseline }
          - { os: ubuntu-24.04-arm, cpu: generic+dotprod }
          - { os: ubuntu-24.04-arm, cpu: baseline }
          - { os: macos-15,         cpu: baseline }
          - { os: windows-latest,   cpu: x86_64_v2 }
          - { os: windows-latest,   cpu: baseline }

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Run tests
        run: zig build test -Dcpu=${{ matrix.cpu }} -Doptimize=ReleaseSafe

  # A wheel per platform and one npm package for all of them, made from the archives
  # above so each package holds exactly the library its archive does.
  packages:
    name: Build the Python wheels and npm package
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/download-artifact@v4
        with:
          pattern: zquant-*
          path: archives
          merge-multiple: true

      - name: Build packages
        run: bash tools/package_release.sh archives packages

      # auditwheel reads the libraries and reports the oldest manylinux they satisfy:
      # symbol versions, and only system libraries a manylinux platform must provide.
      # The tag each wheel claims must be no older than that. (Its human-readable
      # output repeats the file name, tag and all, so it is the JSON that is checked.)
      - name: Check the manylinux tags
        run: |
          python -m pip install auditwheel
          for whl in packages/*manylinux*.whl; do
            auditwheel show "$whl"
            auditwheel show --json "$whl" > audit.json
            python - "$whl" audit.json <<'PY'
          import json, re, sys
          claimed = re.search(r"manylinux_(\d+)_(\d+)", sys.argv[1])
          needed = re.search(r"manylinux_(\d+)_(\d+)", json.load(open(sys.argv[2]))["overall_tag"])
          assert needed, f"{sys.argv[1]}: auditwheel found no manylinux tag its libraries satisfy"
          c, n = tuple(map(int, claimed.groups())), tuple(map(int, needed.groups()))
          assert n <= c, f"{sys.argv[1]} claims manylinux_{c[0]}_{c[1]}, but its libraries need {needed.group(0)}"
          print(f"ok: claims manylinux_{c[0]}_{c[1]}; its libraries need only {needed.group(0)}")
          PY
          done

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages/

  # Install each package the way a user would, on each architecture, and use it.
  # pip is left to pick the wheel from all five, which also checks the tags select the
  # right one.
  packages-test:
    name: Install packages on ${{ matrix.os }}
    needs: packages
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      # Into the temp directory, and used through relative paths: on Windows the
      # workspace path has backslashes, which bash would read as glob escapes.
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: ${{ runner.temp }}/packages

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Python
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv venv
          if [ -d venv/Scripts ]; then py=venv/Scripts/python; else py=venv/bin/python; fi
          "$py" -m pip install numpy
          "$py" -m pip install --no-index --find-links packages zquant
          "$py" - <<'PY'
          import numpy as np, zquant
          info = zquant.build_info()
          print(info)
          assert "site-packages" in str(info.library), info.library
          assert not info.portable
          x = np.random.default_rng(0).standard_normal((2000, 64)).astype("float32")
          index = zquant.Index(dim=64, bits=5)
          index.add(x, threads=2)
          ids, _ = index.search(x[:20], k=1)
          assert (ids[:, 0] == np.arange(20)).all(), ids[:, 0]
          again = zquant.Index.from_bytes(index.to_bytes())
          assert again.bits == 5 and (again.search(x[:20], k=1)[0] == ids).all()
          print("ok")
          PY

      - name: Node
        working-directory: ${{ runner.temp }}
        run: |
          mkdir consumer && cd consumer
          npm init -y > /dev/null
          npm install ../packages/zquant-*.tgz
          cat > use.mjs <<'JS'
          import { Index, buildInfo } from 'zquant';
          const info = buildInfo();
          console.log(info);
          if (!info.libraryPath.includes('node_modules')) throw new Error(`loaded ${info.libraryPath}`);
          if (info.portable) throw new Error('loaded the portable library on a CPU that has no need of it');
          const dim = 64, n = 2000;
          const x = new Float32Array(n * dim).map(() => Math.random() - 0.5);
          const index = new Index({ dim, bits: 5 });
          index.add(x, { threads: 2 });
          const { ids } = index.search(x.subarray(0, 20 * dim), { k: 1 });
          for (let i = 0; i < 20; i++) if (ids[i] !== i) throw new Error(`query ${i} found ${ids[i]}`);
          const again = Index.deserialize(index.serialize());
          if (again.settings.bits !== 5 || again.search(x.subarray(0, dim), { k: 1 }).ids[0] !== 0) throw new Error('round trip');
          index.close(); again.close();
          console.log('ok');
          JS
          node use.mjs

  release:
    name: Publish release
    needs: [build, test, packages-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.whl
            dist/*.tgz
          generate_release_notes: true
